services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lab-03-sensitive-business-data-leakage

    ports:
      - "8501:8501"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./vectorstore:/app/vectorstore

    restart: unless-stopped